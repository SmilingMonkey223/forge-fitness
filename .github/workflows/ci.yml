name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libpq-dev \
          libpqxx-dev \
          libssl-dev \
          pkg-config

    - name: Build backend
      run: |
        cd backend
        mkdir build && cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..
        cmake --build . -j$(nproc)

    - name: Run migrations
      env:
        DATABASE_URL: postgresql://forge:forge@localhost:5432/forge_test
      run: |
        for file in backend/migrations/*.sql; do
          psql $DATABASE_URL -f $file
        done

    - name: Run tests
      env:
        DATABASE_URL: postgresql://forge:forge@localhost:5432/forge_test
        JWT_SECRET: test-secret-key-for-ci-only-do-not-use-in-production
      run: |
        cd backend/build
        ctest --output-on-failure

  frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Lint
      run: |
        cd frontend
        npm run lint

    - name: Build
      run: |
        cd frontend
        npm run build

    - name: Check bundle size
      run: |
        cd frontend
        BUNDLE_SIZE=$(du -sb dist | cut -f1)
        BUNDLE_SIZE_MB=$((BUNDLE_SIZE / 1024 / 1024))
        echo "Bundle size: ${BUNDLE_SIZE_MB}MB"
        if [ $BUNDLE_SIZE_MB -gt 2 ]; then
          echo "Error: Bundle size exceeds 2MB limit"
          exit 1
        fi

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check C++ formatting
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format
        find backend/src backend/include -name "*.cpp" -o -name "*.hpp" | \
          xargs clang-format --dry-run --Werror
